spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================================================
# API ROUTES
# Each route maps a URL prefix to a downstream microservice via Eureka (lb://).
# Route index must be sequential — no gaps — or Spring Cloud Gateway ignores
# routes after the first missing index.
# =============================================================================

spring.cloud.gateway.routes[0].id=auth-api
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/oauth2/**,/login/**

spring.cloud.gateway.routes[1].id=workspace-api
spring.cloud.gateway.routes[1].uri=lb://workspace-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workspaces/**

spring.cloud.gateway.routes[2].id=board-api
spring.cloud.gateway.routes[2].uri=lb://board-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/boards/**

spring.cloud.gateway.routes[3].id=card-api
spring.cloud.gateway.routes[3].uri=lb://card-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/cards/**

spring.cloud.gateway.routes[4].id=comment-api
spring.cloud.gateway.routes[4].uri=lb://comment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/comments/**

spring.cloud.gateway.routes[5].id=label-api
spring.cloud.gateway.routes[5].uri=lb://label-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/labels/**

spring.cloud.gateway.routes[6].id=notification-api
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**

# =============================================================================
# OPENAPI DOCS ROUTES
# Prefixed by service name so the gateway can proxy each service's /api-docs
# without ambiguity. The RewritePath filter strips the prefix before forwarding.
# Example: /label/api-docs → forwarded to label-service as /api-docs
# =============================================================================

spring.cloud.gateway.routes[7].id=auth-docs
spring.cloud.gateway.routes[7].uri=lb://auth-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/auth/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[8].id=workspace-docs
spring.cloud.gateway.routes[8].uri=lb://workspace-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/workspace/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/workspace/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[9].id=board-docs
spring.cloud.gateway.routes[9].uri=lb://board-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/board/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/board/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[10].id=card-docs
spring.cloud.gateway.routes[10].uri=lb://card-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/card/**
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/card/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[11].id=comment-docs
spring.cloud.gateway.routes[11].uri=lb://comment-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/comment/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/comment/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[12].id=label-docs
spring.cloud.gateway.routes[12].uri=lb://label-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/label/**
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/label/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[13].id=notification-docs
spring.cloud.gateway.routes[13].uri=lb://notification-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/notification/**
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/notification/(?<segment>.*),/$\{segment}

# =============================================================================
# AGGREGATED SWAGGER UI  —  http://localhost:8080/swagger-ui.html
# Lists all services so developers can browse every API from one page.
# =============================================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/api-docs
springdoc.swagger-ui.urls[1].name=Workspace Service
springdoc.swagger-ui.urls[1].url=/workspace/api-docs
springdoc.swagger-ui.urls[2].name=Board Service
springdoc.swagger-ui.urls[2].url=/board/api-docs
springdoc.swagger-ui.urls[3].name=Card Service
springdoc.swagger-ui.urls[3].url=/card/api-docs
springdoc.swagger-ui.urls[4].name=Comment Service
springdoc.swagger-ui.urls[4].url=/comment/api-docs
springdoc.swagger-ui.urls[5].name=Label Service
springdoc.swagger-ui.urls[5].url=/label/api-docs
springdoc.swagger-ui.urls[6].name=Notification Service
springdoc.swagger-ui.urls[6].url=/notification/api-docs
# =============================================================================
# CORS
# Allows the React frontend (port 3000) to call the gateway cross-origin.
# allowCredentials=true is needed so cookies (accessToken) are sent.
# In production: set ALLOWED_ORIGINS env variable to your real frontend domain.
# =============================================================================

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true