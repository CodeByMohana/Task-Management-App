spring.application.name=label-service

server.port=8086

# ─── Database ─────────────────────────────────────────────────────────────────
# Each microservice has its own database — label-service owns flowboard_label.
# createDatabaseIfNotExist=true means MySQL auto-creates the DB on first start.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flowboard_label?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate creates/updates tables from your @Entity classes.
# For production, switch to 'validate' and manage schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────────────
# This MUST match auth-service's jwt.secret exactly.
# If they differ, label-service will reject all tokens from auth-service.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
# /api-docs   → raw JSON spec (used by the gateway's aggregated Swagger UI)
# /swagger-ui → interactive UI (useful when calling this service directly)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ─── Eureka ───────────────────────────────────────────────────────────────────
# Registers this service with Eureka so the gateway can discover it by name.
# The gateway uses 'lb://label-service' to route /api/labels/** here.
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# Forwards gateway headers (X-Forwarded-For, X-Forwarded-Host) correctly
server.forward-headers-strategy=framework
